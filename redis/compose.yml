x-networks: &networks
  networks:
    - default
x-labels: &project_labels
  labels:
    project_name: "${PR_NAME:-project}"
x-restart: &restart
  restart: unless-stopped

services:
  redis:
    <<: [*networks, *restart, *project_labels]
    image: redis:alpine
    container_name: redis
    ports:
      - ${REDIS_PORT:-0.0.0.0:6379}:6379
    # command: redis-server --save 500 1 --loglevel debug --requirepass $REDIS_PWD
    # command: redis-server --save 20 1 --loglevel notice
    command: redis-server --save 20 1 --loglevel debug --requirepass $REDIS_PWD
    volumes:
      - ./cache:/data:z

networks:
  default:
    name: ${MYNET:?}
    external: true
