x-networks: &networks
  networks:
    - default
x-labels: &project_labels
  labels:
    project_name: ${PR_NAME:-project}
x-restart: &restart
  restart: unless-stopped

services:
  sonar:
    <<: [*networks, *restart, *project_labels]
    image: sonarqube${SONAR_TAG:-:community}
    container_name: sonarqube
    read_only: true
    # We use traefik for access to kafbat
    # ports:
    #   - ${SONAR_PORT:-0.0.0.0:9000}:9000
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${SONAR_DB_ADDRESS:?}:${SONAR_DB_PORT:?}/${SONAR_DB_NAME:?}
      SONAR_JDBC_USERNAME: ${SONAR_USER:?}
      SONAR_JDBC_PASSWORD: ${SONAR_PASS:?}
      SONAR_WEB_CONTEXT: /
    volumes:
      - ./sonarqube_data:/opt/sonarqube/data:Z,U
      - ./sonarqube_extensions:/opt/sonarqube/extensions:Z,U
      - ./sonarqube_logs:/opt/sonarqube/logs:Z,U
      - ./sonarqube_temp:/opt/sonarqube/temp:Z,U
    tmpfs:
      - /tmp:size=256M,mode=1777


networks:
  default:
    name: ${MYNET:?}
    external: true
