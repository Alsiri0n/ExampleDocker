[http]
  [http.routers]
    [http.routers.api]
      entryPoints = ['websecure']
      rule = 'Host(`{{ env "TRAEFIKHOSTNAME"}}`)'
      middlewares = ['traefik-auth']
      service = "api@internal"
      [http.routers.api.tls]
    # [http.routers.gitea]
    #   entryPoints = ['web']
